# Regenerates the contribution snake in the bruteon palette.
# Output lands on the `output` branch as snake-bruteon.svg.
name: generate bruteon snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-bruteon.svg?color_snake=#C8321E&color_dots=#EDE6DA,#D9C9B0,#E8B730,#8A5A3C,#1A1512

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
